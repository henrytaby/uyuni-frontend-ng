<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400">
    <div
      class="mr-3 flex items-center justify-center rounded-full h-9 w-9 overflow-hidden bg-brand-500/10 text-brand-600 border border-brand-500/20">
      @if (currentUser()?.avatar_url) {
        <img [src]="currentUser()?.avatar_url" [alt]="currentUser()?.first_name || 'Avatar'" class="h-full w-full object-cover" />
      } @else {
        <span class="font-bold text-sm">{{ userInitials() }}</span>
      }
    </div>
    <span class="block mr-1 font-medium text-theme-sm">{{ currentUser()?.first_name }} {{ currentUser()?.last_name
      }}</span>
    <i class="pi transition-transform duration-200" [class.pi-chevron-down]="!isOpen()"
      [class.pi-chevron-up]="isOpen()"></i>
  </button>

  <app-dropdown [isOpen]="isOpen()" (closeDropdown)="closeDropdown()"
    className="absolute right-0 mt-2.75 flex w-65 flex-col rounded-2xl border border-gray-200/50 bg-white/90 backdrop-blur-xl p-3 shadow-theme-lg dark:border-gray-800/50 dark:bg-gray-900/90 animate-dropdown-in">
    <div class="flex items-center gap-2.5 pb-2 border-b border-gray-100 dark:border-gray-800">
      <div
        class="flex items-center justify-center rounded-full h-10 w-10 shrink-0 overflow-hidden bg-brand-500/10 text-brand-600 border border-brand-500/20">
        @if (currentUser()?.avatar_url) {
          <img [src]="currentUser()?.avatar_url" [alt]="currentUser()?.first_name || 'Avatar'" class="h-full w-full object-cover" />
        } @else {
          <span class="font-bold text-sm">{{ userInitials() }}</span>
        }
      </div>
      <div class="min-w-0 flex-1">
        <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400 truncate">
          {{ currentUser()?.first_name }} {{ currentUser()?.last_name }}
        </span>
        <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400 truncate">
          {{ currentUser()?.email }}
        </span>
      </div>
    </div>

    <div class="py-1 border-b border-gray-100 dark:border-gray-800">
      <app-dropdown-item (itemClick)="closeDropdown()" [to]="'/profile'"
        className="flex w-full items-center gap-2.5 px-3 py-2 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5">
        <svg lucideSquareUserRound size="18"
          class="text-gray-500 group-hover:text-gray-700 dark:text-gray-400 dark:group-hover:text-gray-200"></svg>
        <span>Mi Perfil</span>
      </app-dropdown-item>
    </div>

    <div class="pt-1">
      <app-dropdown-item (click)="handleLogout()"
        className="flex w-full items-center gap-2.5 px-3 py-2 font-medium text-red-600 rounded-lg group text-theme-sm hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30">
        <svg lucideLogOut size="18" class="text-red-500 group-hover:text-red-600 dark:text-red-400"></svg>
        <span>Cerrar sesión</span>
      </app-dropdown-item>
    </div>
  </app-dropdown>
</div>
