<button type="button" (click)="toggleTheme()"
  class="h-9 w-9 rounded-full border border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-all flex items-center justify-center shadow-xs cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-brand-500"
  title="Cambiar tema">
  @if ((theme$ | async) === 'dark') {
    <svg lucideSun size="16" class="text-amber-400"></svg>
  } @else {
    <svg lucideMoon size="16" class="text-gray-600"></svg>
  }
</button>
