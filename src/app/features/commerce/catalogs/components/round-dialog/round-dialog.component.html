<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [header]="mode() === 'create' ? 'Nueva Ronda de Inversión' : 'Editar Ronda de Inversión'"
  [style]="{ width: '30rem', maxWidth: '95vw' }">

  <div class="flex flex-col gap-3 py-2 text-xs">
    <div class="grid grid-cols-3 gap-2">
      <div class="col-span-1">
        <label for="rnd_code" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
          Código <span class="text-red-500">*</span>
        </label>
        <input
          pInputText
          id="rnd_code"
          type="text"
          class="w-full text-xs uppercase"
          placeholder="RONDA-1"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)" />
      </div>

      <div class="col-span-2">
        <label for="rnd_name" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
          Nombre de la Ronda <span class="text-red-500">*</span>
        </label>
        <input
          pInputText
          id="rnd_name"
          type="text"
          class="w-full text-xs"
          placeholder="Ej: Ronda Semilla Inicial"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label for="rnd_date" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
          Fecha de Desembolso
        </label>
        <input
          pInputText
          id="rnd_date"
          type="date"
          class="w-full text-xs"
          [ngModel]="disbursementDate()"
          (ngModelChange)="disbursementDate.set($event)" />
      </div>

      <div>
        <label for="rnd_capital" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
          Capital Aportado (Bs)
        </label>
        <p-inputnumber
          inputId="rnd_capital"
          [ngModel]="capitalInvested()"
          (ngModelChange)="capitalInvested.set($event || 0)"
          mode="decimal"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [min]="0"
          class="w-full text-xs" />
      </div>
    </div>

    <div>
      <label for="rnd_status" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
        Estado de la Ronda
      </label>
      <p-select
        inputId="rnd_status"
        [options]="statusOptions"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        optionLabel="label"
        optionValue="value"
        class="w-full text-xs" />
    </div>

    <div>
      <label for="rnd_obs" class="block font-semibold text-gray-700 dark:text-gray-300 mb-1">
        Observaciones o Condiciones del Aporte
      </label>
      <textarea
        pTextarea
        id="rnd_obs"
        rows="2"
        class="w-full text-xs"
        placeholder="Socios participantes, condiciones de retorno, etc."
        [ngModel]="observations()"
        (ngModelChange)="observations.set($event)"></textarea>
    </div>
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 dark:border-gray-800">
      <p-button
        label="Cancelar"
        severity="secondary"
        variant="text"
        size="small"
        (onClick)="visible.set(false)"
        [disabled]="isSubmitting()" />

      <p-button
        [label]="mode() === 'create' ? 'Crear Ronda' : 'Guardar'"
        icon="pi pi-check"
        size="small"
        (onClick)="saveRound()"
        [loading]="isSubmitting()"
        [disabled]="!isFormValid()" />
    </div>
  </ng-template>

</p-dialog>
