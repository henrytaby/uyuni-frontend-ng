<app-media-gallery
  [items]="images()"
  [title]="'Fotografías de Catálogo'"
  [badgeText]="'CATALOG'"
  [subtitle]="'Subidas en alta resolución y procesadas automáticamente en formato WebP optimizado.'"
  [emptyTitle]="'Sin fotografías aún'"
  [emptySubtitle]="'Arrastra tus fotos arriba para armar el book comercial del producto.'"
  [entityName]="productName() || 'producto_maestro'"
  [zipBaseName]="'catalogo'"
  [mode]="mode()"
  [createModeTitle]="'Gestión de Galería Habilitada tras Guardar'"
  [createModeDescription]="'Para arrastrar y subir fotografías de alta calidad (WebP) y configurar la portada oficial, primero debe registrar los datos iniciales de la ficha maestra.'"
  [createModeActionLabel]="'Completar Ficha Comercial'"
  [isMaximized]="isMaximized()"
  [isLoading]="isLoadingImages()"
  [isUploading]="isUploadingImages()"
  [uploadProgress]="uploadProgress()"
  [cardBadgeTemplate]="cardBadge"
  [cardActionTemplate]="cardAction"
  [previewModalActionsTemplate]="modalActions"
  (filesDropped)="uploadSelectedFiles($event)"
  (reordered)="onReordered($event)"
  (deleteSingle)="onDeleteSingle($event)"
  (deleteMultiple)="onDeleteMultiple($event)"
  (refresh)="onRefresh()"
  (requestCreateAction)="requestCreateProduct.emit()">

  <!-- Slot de Badge: Portada Oficial -->
  <ng-template #cardBadge let-img>
    @if (img.is_cover) {
      <div class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500 text-white shadow-xs flex items-center gap-1">
        <svg lucideStar size="11" class="fill-white"></svg>
        <span>Portada Oficial</span>
      </div>
    }
  </ng-template>

  <!-- Slot de Acción en Card: Fijar como Portada -->
  <ng-template #cardAction let-img>
    @if (img.is_cover) {
      <div class="w-full py-1 text-center text-[11px] font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40 rounded flex items-center justify-center gap-1">
        <svg lucideCheck size="12" class="text-amber-600 dark:text-amber-400"></svg>
        <span>Portada Activa</span>
      </div>
    } @else {
      <button
        type="button"
        (click)="setAsCover(img)"
        class="w-full py-1 text-[11px] font-medium text-gray-600 dark:text-gray-300 hover:text-amber-600 dark:hover:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/30 rounded border border-gray-200 dark:border-gray-700 transition-colors flex items-center justify-center gap-1 cursor-pointer">
        <svg lucideStar size="12"></svg>
        <span>Fijar como Portada</span>
      </button>
    }
  </ng-template>

  <!-- Slot de Acción en Modal de Preview: Definir como Portada -->
  <ng-template #modalActions let-pImg>
    @if (!pImg.is_cover) {
      <p-button
        label="Definir como Portada"
        icon="pi pi-star"
        size="small"
        severity="warn"
        [outlined]="true"
        (click)="setAsCover(pImg)">
      </p-button>
    }
  </ng-template>

</app-media-gallery>
